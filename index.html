    <script>
      // Compatibility shim for browser extensions attempting to override window.fetch
      try {
        const _origFetch = window.fetch ? window.fetch.bind(window) : null;
        let _activeFetch = _origFetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get() {
            return _activeFetch;
          },
          set(newFetch) {
            _activeFetch = typeof newFetch === 'function' ? newFetch : _origFetch;
          }
        });
      } catch (e) {
        // Safe failover
      }
    </script>
